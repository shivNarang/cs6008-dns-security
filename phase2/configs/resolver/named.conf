// Recursive caching resolver (Phase 1: DNSSEC validation OFF)
include "/etc/bind/rndc.key";

controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};

options {
    directory "/var/cache/bind";
    recursion yes;
    dnssec-validation no;          // Phase 1 baseline; Phase 3 turns this on
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    allow-recursion { any; };
    empty-zones-enable no;
    // No forwarders: resolve iteratively from the root hints below.
};

zone "." {
    type hint;
    file "/etc/bind/db.root";
};
