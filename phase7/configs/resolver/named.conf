// Phase 7: validating resolver with encrypted last mile (DoT 853 + DoH 443).
include "/etc/bind/rndc.key";
include "/etc/bind/trust-anchor.conf";

controls { inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; }; };

tls local-tls {
    cert-file "/etc/bind/certs/resolver.crt";
    key-file  "/etc/bind/certs/resolver.key";
};
http local-http { endpoints { "/dns-query"; }; };

options {
    directory "/var/cache/bind";
    recursion yes;
    dnssec-validation yes;
    listen-on { any; };                                 // plain :53 (cleartext path)
    listen-on port 853 tls local-tls { any; };          // DoT
    listen-on port 443 tls local-tls http local-http { any; };  // DoH
    listen-on-v6 { none; };
    allow-query { any; };
    allow-recursion { any; };
    empty-zones-enable no;
};
zone "." { type hint; file "/etc/bind/db.root"; };
