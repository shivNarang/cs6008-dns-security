// Phase 3: recursive resolver with DNSSEC validation ON, anchored at the root KSK
include "/etc/bind/rndc.key";
include "/etc/bind/trust-anchor.conf";

controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};

options {
    directory "/var/cache/bind";
    recursion yes;
    dnssec-validation yes;         // validate using the trust anchor above
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    allow-recursion { any; };
    empty-zones-enable no;
};

zone "." {
    type hint;
    file "/etc/bind/db.root";
};
